name: verify public repository

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: bitcoinuniverseio/.github-private/.github/workflows/route.yml@develop
    secrets: inherit
    with:
      plan: '{"verify":"light"}'

  verify:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.targets).verify }}
    timeout-minutes: 5
    steps:
      - name: Check out public content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Verify public boundary and artifacts
        run: node scripts/verify-public.mjs
