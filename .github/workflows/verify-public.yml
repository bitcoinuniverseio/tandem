name: verify public repository

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets: inherit
    with:
      plan: '{"verify":"light"}'
      config_ref: 1dd19289af21f4f6be01f874390a180b3af8bb38

  verify:
    needs: route
    # Capacity routing can place this job on private self-hosted capacity, so
    # pull requests from forks are excluded from it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.route.outputs.targets).verify }}
    timeout-minutes: 5
    steps:
      - name: Check out public content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
      - name: Verify public boundary and artifacts
        run: node scripts/verify-public.mjs
