name: Documentation correction
description: Propose a factual, safety, clarity, or local-link correction in public documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: checkboxes
    id: boundary
    attributes:
      label: Repository boundary
      options:
        - label: This request concerns public information and contains no internal, operational, private, or security-sensitive detail.
          required: true
  - type: input
    id: path
    attributes:
      label: Document path
      placeholder: docs/what-is-tandem.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Quote only the minimum public text needed to locate the issue.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Explain the accurate replacement and include a public source when useful.
    validations:
      required: true
